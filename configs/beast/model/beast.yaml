_target_: policies.beastf.beastf_config.BeastVLAConfig

use_amp: true
normalization_mapping:
  VISUAL: IDENTITY
  STATE: MEAN_STD
  ACTION: MEAN_STD

vlm_path: "microsoft/Florence-2-base"
freeze_florence: false
freeze_vision_tower: false
freeze_embeddings_only: false
task: "fold the towel"
prompt_robot_name: "Franka Panda"
prompt_num_arms: 1
prompt_action_space: "7 joint positions + 1 gripper width"
prompt_include_meta: true
image_resize_hw: [224, 224]
image_use_clip_normalization: true
use_random_shifts_aug: false
random_shifts_pad_primary: 10
random_shifts_pad_wrist: 4

act_window_size: 16
multistep: 16
chunk_size: 16
n_action_steps: 16

num_basis: 5
num_dof: 8
action_dim: 8
gripper_dof: 1
gripper_zero_order: False
update_w_bound: true
tokenizer_w_bound: 1.0

use_second_view: true
second_view_key: "observation.image.wrist_cam"
use_proprio: false
